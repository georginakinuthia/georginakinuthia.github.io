<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Georgina Kinuthia — Sustainable Urban Designer &amp; Architect</title>
<style>
  /* Core Reset and Minimalist Typography */
  body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; background-color: #fff; }
  a { color: #1a0dab; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Global Fixed Top Navigation Bar */
  .global-nav { background-color: #2c3e50; padding: 14px 40px; display: flex; gap: 24px; align-items: center; }
  .global-nav a { color: #fff; font-size: 15px; font-weight: 500; }
  .global-nav a.brand { font-weight: 700; font-size: 17px; }

  /* Core Main Content Split Grid Layout */
  .main-wrapper { max-width: 1040px; margin: 40px auto; padding: 0 40px; display: grid; grid-template-columns: 1fr; gap: 40px; }
  @media (min-width: 768px) { .main-wrapper { grid-template-columns: 2fr 1fr; } }

  /* Left Side Text Content */
  .content-column h1 { font-size: 32px; font-weight: 700; margin: 0 0 16px; }
  .content-column p { margin: 0 0 1.5em; font-size: 15.5px; text-align: justify; }

  /* Button Flexbox Container for Inline Contact Badges */
  .badge-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .social-badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #dcdcdc; background-color: #f9f9f9; padding: 4px 12px; border-radius: 4px; font-size: 13px; color: #555; }
  .social-badge:hover { background-color: #eee; color: #111; }
  .social-badge svg { fill: currentColor; width: 14px; height: 14px; }

  /* Right Side Photo Layout */
  .photo-column { display: flex; justify-content: center; }
  .circular-portrait { width: 240px; height: 240px; border-radius: 50%; object-fit: cover; }
  footer { max-width: 1040px; margin: 60px auto 40px; padding: 20px 40px; border-top: 1px solid #eaeaea; font-size: 13.5px; color: #666; }
</style>
</head>
<body>
  <nav class="global-nav">
    <a href="/index.html" class="brand">Georgina Kinuthia</a>
    <a href="/about.html">About</a>
    <a href="/works.html">Works</a>
  </nav>

  <div class="main-wrapper">
    <div class="content-column">
      <h1>Georgina Kinuthia</h1>
      <div class="badge-container">
        <a href="https://linkedin.com" target="_blank" class="social-badge">LinkedIn</a>
        <a href="https://github.com" target="_blank" class="social-badge">GitHub</a>
      </div>
      <p>Sustainable urban designer and architect focusing on spatial data and participatory design.</p>
    </div>
    <div class="photo-column">
      <img src="/portraitprofile.jpg" alt="Georgina Kinuthia" class="circular-portrait">
    </div>
  </div>
</body>
</html>
