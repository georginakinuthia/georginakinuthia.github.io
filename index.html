<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgina Kinuthia — Sustainable Urban Designer & Registered Architect</title>
    <style>
        :root {
            --text-color: #2b2b2b;
            --bg-color: #ffffff;
            --accent-color: #d35400; /* Subtle rust/orange highlight line */
            --link-color: #116699;
            --subtext-color: #666666;
            --border-color: #e5e5e5;
            --sidebar-width: 320px;
            --font-main: 'Helvetica Neue', Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-color);
            background-color: var(--bg-color);
            display: flex;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Active Text Links Styling */
        a {
            color: var(--link-color);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--accent-color);
        }

        /* Sidebar Styling */
        aside {
            width: var(--sidebar-width);
            padding: 4rem 2.5rem;
            position: fixed;
            height: 100vh;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #fafafa;
            z-index: 10;
        }

        .brand h1 {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 0.5rem;
            color: #111;
        }

        .brand .nfi-badge {
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-color);
            margin-bottom: 3rem;
            display: block;
        }

        nav ul {
            list-style: none;
        }

        nav ul li {
            margin-bottom: 1.2rem;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--subtext-color);
            font-size: 1.05rem;
            font-weight: 500;
            transition: color 0.2s ease, padding-left 0.2s ease;
            display: inline-block;
            cursor: pointer;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--text-color);
            font-weight: 700;
            padding-left: 6px;
        }

        /* Main Content Styling */
        main {
            margin-left: var(--sidebar-width);
            padding: 4rem 4rem 6rem 5rem;
            max-width: 960px;
            width: 100%;
            min-height: 100vh;
        }

        /* Top Bar Navigation Links */
        .top-links {
            margin-bottom: 3rem;
            display: flex;
            gap: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .top-links a {
            text-decoration: none;
            color: var(--subtext-color);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .top-links a:hover {
            color: var(--accent-color);
        }

        /* Fail-Safe Display Rules */
        .page-section {
            display: none;
        }

        /* Ensure default section displays immediately */
        .page-section.active,
        .page-section:target {
            display: block !important;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Section Titles */
        .section-header {
            margin-bottom: 2.5rem;
        }

        .section-header h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            position: relative;
            display: inline-block;
            color: #111;
        }

        .section-header h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-color);
        }

        /* Profile Image */
        .profile-img {
            width: 190px;
            height: 190px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 2.5rem;
            display: block;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            background-color: #f0f0f0;
        }

        .bio-text p {
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
            color: #333;
            line-height: 1.75;
            text-align: justify;
        }

        /* Highlighted Key Facts in Text */
        .key-fact {
            font-weight: 700;
            color: #111;
            background-color: #fff8f3;
            padding: 2px 4px;
            border-left: 2px solid var(--accent-color);
        }

        /* Works Cards */
        .works-grid {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }
