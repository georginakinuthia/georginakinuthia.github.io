<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgina Kinuthia — Sustainable Urban Designer & Registered Architect</title>
    <style>
        :root {
            --text-color: #2b2b2b;
            --bg-color: #ffffff;
            --accent-color: #d35400; /* Rust / orange accent */
            --link-color: #116699;
            --subtext-color: #666666;
            --border-color: #e5e5e5;
            --sidebar-width: 320px;
            --font-main: 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-color);
            background-color: var(--bg-color);
            display: flex;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Text Links Styling */
        a {
            color: var(--link-color);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--accent-color);
        }

        /* Sidebar Styling */
        aside {
            width: var(--sidebar-width);
            padding: 4rem 2.5rem;
            position: fixed;
            height: 100vh;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #fafafa;
            z-index: 10;
        }

        .brand h1 {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 0.5rem;
            color: #111;
        }

        .brand .nfi-badge {
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-color);
            margin-bottom: 3rem;
            display: block;
        }

        nav ul {
            list-style: none;
        }

        nav ul li {
            margin-bottom: 1.2rem;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--subtext-color);
            font-size: 1.05rem;
            font-weight: 500;
            transition: color 0.2s ease, padding-left 0.2s ease;
            display: inline-block;
            cursor: pointer;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--text-color);
            font-weight: 700;
            padding-left: 6px;
        }

        /* Main Content Workspace */
        main {
            margin-left: var(--sidebar-width);
            padding: 4rem 4rem 6rem 5rem;
            max-width: 960px;
            width: 100%;
            min-height: 100vh;
        }

        /* Top Bar Navigation Links */
        .top-links {
            margin-bottom: 3rem;
            display: flex;
            gap: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .top-links a {
            text-decoration: none;
            color: var(--subtext-color);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .top-links a:hover {
            color: var(--accent-color);
        }

        /* Section Visibility Rules */
        .page-section {
            display: none;
        }

        .page-section.active {
            display: block !important;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Section Titles */
        .section-header {
            margin-bottom: 2.5rem;
        }

        .section-header h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            position: relative;
            display: inline-block;
            color: #111;
        }

        .section-header h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-color);
        }

        /* Profile Image */
        .profile-img {
            width: 190px;
            height: 190px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 2.5rem;
            display: block;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            background-color: #f0f0f0;
        }

        .bio-text p {
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
            color: #333;
            line-height: 1.75;
            text-align: justify;
        }

        /* Highlighted Key Facts in Text */
        .key-fact {
            font-weight: 700;
            color: #111;
            background-color: #fff8f3;
            padding: 2px 4px;
            border-left: 2px solid var(--accent-color);
        }

        /* Works Cards */
        .works-grid {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .work-card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background-color: #fff;
        }

        .work-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }

        .work-card .tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .work-card h3 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: #111;
        }

        .work-card .meta {
            font-size: 0.9rem;
            color: var(--subtext-color);
            margin-bottom: 1rem;
        }

        .work-card p {
            font-size: 1rem;
            color: #444;
            margin-bottom: 1.2rem;
        }

        .work-card .tech-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tech-tag {
            background-color: #f0f0f0;
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 3px;
            color: #555;
        }

        /* Services Section */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 2rem;
        }

        .service-item {
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 6px;
            background-color: #fff;
        }

        .service-item h3 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: #111;
        }

        .service-item p {
            font-size: 0.98rem;
            color: #555;
            line-height: 1.65;
        }

        /* CV Timeline */
        .cv-block {
            margin-bottom: 3rem;
        }

        .cv-block h3 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .timeline-item {
            margin-bottom: 2rem;
            position: relative;
            padding-left: 1.5rem;
            border-left: 2px solid var(--border-color);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 6px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-color);
        }

        .timeline-item h4 {
            font-size: 1.15rem;
            color: #111;
        }

        .timeline-item .institution {
            font-size: 0.95rem;
            font-weight: 600;
            color: #444;
        }

        .timeline-item .date {
            font-size: 0.85rem;
            color: var(--subtext-color);
            margin-bottom: 0.75rem;
        }

        .timeline-item ul {
            margin-left: 1.2rem;
            font-size: 0.95rem;
            color: #444;
        }

        .timeline-item ul li {
            margin-bottom: 0.4rem;
        }

        /* Footer */
        footer {
            margin-top: 5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
            font-size: 0.85rem;
            color: #888;
        }

        /* Responsive Mobile Breakpoint */
        @media (max-width: 820px) {
            body {
                flex-direction: column;
            }
            aside {
                position: static;
                width: 100%;
                height: auto;
                padding: 2.5rem 2rem;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .brand h1 {
                margin-bottom: 0.25rem;
            }
            .brand .nfi-badge {
                margin-bottom: 1.5rem;
            }
            main {
                margin-left: 0;
                padding: 2rem;
            }
            .bio-text p {
                text-align: left;
            }
            .services-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

        <div>
            <div class="brand">
                <h1>Georgina<br>Kinuthia</h1>
                <span class="nfi-badge">Norman Foster Institute Scholar</span>
            </div>
            <nav>
                <ul>
                    <li><a href="#about" onclick="showTab('about')" id="nav-about" class="active">— About</a></li>
                    <li><a href="#works" onclick="showTab('works')" id="nav-works">— Works</a></li>
                    <li><a href="#services" onclick="showTab('services')" id="nav-services">— Services</a></li>
                    <li><a href="#cv" onclick="showTab('cv')" id="nav-cv">— CV</a></li>
                </ul>
            </nav>
        </div>
    </aside>
