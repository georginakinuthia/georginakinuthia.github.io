<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Georgina Kinuthia | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #3b82f6;
      --border: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text);
      text-decoration: none;
      text-transform: uppercase;
    }
    .brand span { color: var(--accent); }

    .nav-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      transition: color 0.2s;
    }
    .btn-back:hover { color: var(--text); }

    .btn-download {
      background: var(--accent);
      color: #ffffff;
      padding: 0.4rem 0.85rem;
      border-radius: 2px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-download:hover { background: #2563eb; }

    .viewer-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 55px);
      background: #18181b;
    }

    object, embed {
      width: 100%;
      height: 100%;
      border: none;
    }

    .fallback-msg {
      padding: 3rem;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .fallback-msg a {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">Georgina Kinuthia<span>.</span> / Portfolio</a>
    <div class="nav-actions">
      <a href="index.html" class="btn-back">← Back to Overview</a>
      <a href="portfolio.pdf" target="_blank" class="btn-download">Open / Download PDF ↗</a>
    </div>
  </header>

  <div class="viewer-container">
    <object data="portfolio.pdf#view=FitH" type="application/pdf">
      <embed src="portfolio.pdf#view=FitH" type="application/pdf" />
      <div class="fallback-msg">
        <p>Your browser is blocking the embedded PDF viewer.</p>
        <p style="margin-top: 1rem;"><a href="portfolio.pdf" target="_blank">Click here to open the portfolio directly ↗</a></p>
      </div>
    </object>
  </div>

</body>
</html>
